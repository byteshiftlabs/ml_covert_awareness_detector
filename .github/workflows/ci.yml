name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run test suite
        run: |
          . .venv/bin/activate
          pytest

      - name: Run quick training smoke path
        env:
          DATASET_DIR: ${{ runner.temp }}/openneuro/ds006623
        run: |
          . .venv/bin/activate
          ./run_quick_training.sh
