[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "covert-awareness-detector"
version = "0.1.2"
description = "Research-oriented ML pipeline for studying covert-awareness-related fMRI connectivity during anesthesia"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "byteshiftlabs"}]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "nibabel>=5.0.0",
    "nilearn>=0.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "imbalanced-learn>=0.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
docs = ["Sphinx>=9.1.0", "sphinx-rtd-theme>=3.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
